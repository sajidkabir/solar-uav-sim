[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solar-uav-sim"
version = "1.0.0"
description = "Solar-powered UAV endurance simulator: energy-balance modeling and charge-consumption parity analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sajid Kabir Saji" }]
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]
keywords = ["uav", "solar", "aerospace", "endurance", "simulation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/sajidkabir/solar-uav-sim"
Repository = "https://github.com/sajidkabir/solar-uav-sim"
Issues = "https://github.com/sajidkabir/solar-uav-sim/issues"
Changelog = "https://github.com/sajidkabir/solar-uav-sim/blob/main/CHANGELOG.md"

[project.scripts]
solar-uav-sim = "solar_uav_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_uav_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
